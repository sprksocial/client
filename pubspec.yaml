name: spark
description: "Spark mobile app"
publish_to: "none"
# The number after + should stay fixed, the android workflow will change it on every build
version: 0.13.2+1
environment:
  sdk: ^3.13.0
workspace:
  - widgetbook
  - fonts
  - assets

dependencies:
  any_link_preview: ^3.0.3
  app_badge_plus: ^1.4.0
  assets:
    path: assets
  audioplayers: ^6.8.1
  auto_route: ^11.2.0
  better_player_plus: ^2.0.1
  bluesky_poptart: ^0.3.0
  ozone_poptart: ^0.3.0
  plyr_poptart: ^0.3.0
  poptart: ^0.1.2
  poptart_lex: ^0.2.0
  sprk_poptart: ^0.3.0
  cached_network_image: ^4.0.6
  camera: ^0.12.2
  collection: ^1.19.1
  crypto: ^3.0.8
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.5.0
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  flutter_web_auth_2: ^5.1.0
  fonts:
    path: fonts
  freezed: ^4.0.1
  freezed_annotation: ^3.1.0
  fvp: ^0.40.0
  get_it: ^9.3.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.10.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  oauth2: ^2.0.5
  pool: ^1.5.3
  posthog_flutter: ^5.60.0
  pro_image_editor: ^14.25.1
  pro_video_editor: ^2.51.2
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  sqflite: ^2.4.5
  synchronized: ^3.6.1
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  camera_platform_interface: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#000000"
  background_image: assets/branding/splash.png
  color_dark: "#000000"
  android_12:
    color: "#000000"
    background_image: assets/branding/splash.png
    color_dark: "#000000"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/sprk.svg
  fonts:
    - family: Fraunces
      fonts:
        - asset: packages/fonts/Fraunces-Variable.ttf
    - family: SN Pro
      fonts:
        - asset: packages/fonts/SNPro-Variable.ttf
